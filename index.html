<title>원더래빗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* 레이아웃: 폭 480px 이하의 한 줄 모바일 앱. 베이지 바탕 + 오호(노랑)=질문, 아하(민트)=정리 */
:root{
  --bg:#F7F1E3; --canvas:#EFE6D2; --card:#FFFCF4; --line:#E8DDC5;
  --oho:#F4C95D; --oho-tint:#FBEBC0; --oho-ink:#7F5B0C;
  --aha:#93DDD0; --aha-tint:#D8F3EE; --aha-ink:#1C6A61;
  --me:#EDE4CF; --heart:#D2604F; --ink:#3B342C; --sub:#6F6354; --stroke:#4A4038;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--aha-ink)}
:focus-visible{outline:3px solid var(--aha-ink);outline-offset:2px;border-radius:8px}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative}
main{zoom:var(--zoom,1);flex:1;padding:16px 20px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:25px} h2{font-size:20px} h3{font-size:17px}
p{margin:0}
.muted{color:var(--sub);font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12px;white-space:nowrap}
.chip.o{background:var(--oho-tint);color:var(--oho-ink)} .chip.a{background:var(--aha-tint);color:var(--aha-ink)}
.chip.d{background:var(--ink);color:var(--card)} .chip.l{border:1px solid var(--line);background:var(--card)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--oho);color:var(--ink);font-family:var(--display);font-size:18px;text-decoration:none}
.btn.mint{background:var(--aha)} .btn.ghost{background:var(--card);border:1px solid var(--ink);font-size:17px}
/* 제목·버튼 글꼴(Jua)은 한 굵기라 굵게 만들지 않음: 어디서나 같은 모양으로 */
.btn,.who,.talk .nm,.top .title,.news .t,.lead .t,h1,h2,h3,.door-logo,.tut-h,.cel-title,.cel-plus,.door-tap,.stats b,[style*="font-family:var(--display)"]{font-weight:400!important}
.btn b,.who b,h1 b,h2 b,h3 b{font-weight:400}
.btn.dark{background:var(--ink);color:var(--card)}
.btn.small{min-height:40px;font-size:14px;padding:0 14px;border-radius:20px}
.btn[disabled]{opacity:.5;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.top{display:flex;align-items:center;gap:10px}
.top .title{flex:1;min-width:0;font-family:var(--display);font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px;flex:1;min-width:0}
.ch{display:block;flex-shrink:0;object-fit:contain;user-select:none;-webkit-user-drag:none}
.ch-both{display:inline-flex;flex-shrink:0}
.talk{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.talk .nm{font-family:var(--display);font-size:14px;line-height:1;padding-left:2px}
.talk .nm.o{color:var(--oho-ink)} .talk .nm.a{color:var(--aha-ink)}
.chat .line.named{align-items:flex-start}
.bubble.o{border-color:var(--oho)} .bubble.a{background:var(--aha-tint);border-color:transparent;border-radius:4px 18px 18px 18px}
.bubble.me{background:var(--me);border:0;border-radius:18px 18px 4px 18px;align-self:flex-end;max-width:82%;flex:none}
.who{font-family:var(--display);font-size:14px}
.who.o{color:var(--oho-ink)} .who.a{color:var(--aha-ink)}
label.f{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
.input,select.input,textarea.input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 14px;font-size:15px}
textarea.input{resize:vertical;min-height:84px;line-height:1.5}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:14px}

.cats::-webkit-scrollbar{display:none}

.cats button[aria-pressed="true"]{border:2px solid var(--ink);background:var(--aha-tint);font-weight:700}

.news .t{font-family:var(--display);font-size:17px;line-height:1.35}
.news .s{font-size:13px;color:var(--sub);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news .body{display:flex;flex-direction:column;gap:4px;min-width:0}
.thumb{width:84px;height:84px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.hero{border-radius:22px;height:170px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.hero .ph{position:absolute;left:12px;bottom:12px}
.lead{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;text-align:left;width:100%;padding:0;display:flex;flex-direction:column}
.lead .hero{border-radius:0;height:140px}
.lead .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.lead .t{font-family:var(--display);font-size:21px;line-height:1.3}
.summary{font-size:16px;line-height:1.8}
.term{background:var(--aha-tint);border:0;border-bottom:2px dotted var(--aha-ink);padding:0 2px;font-size:inherit;line-height:inherit;border-radius:3px}
.quiz{background:var(--oho-tint);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.quiz button.opt{min-height:44px;text-align:left;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.quiz button.opt.right{border:2px solid var(--aha-ink);background:var(--aha-tint)}
.quiz button.opt.wrong{border:2px solid var(--oho-ink)}
.compare{border:1px solid var(--aha);background:var(--card)}
.outlet{display:flex;gap:10px;align-items:flex-start}
.outlet .chip{flex-shrink:0}
.mission{border:1.5px dashed var(--aha);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.slider{display:flex;flex-direction:column;gap:8px}
.track{position:relative;height:32px}
.track input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:0;position:relative;z-index:2}
.track input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--oho),var(--me) 50%,var(--aha))}
.track input[type=range]::-moz-range-track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--oho),var(--me) 50%,var(--aha))}
.track input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid var(--stroke)}
.track input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--stroke)}
.ghostdot{position:absolute;top:4px;width:24px;height:24px;margin-left:-12px;border-radius:50%;border:2px dashed var(--sub);background:rgba(255,252,244,.6);z-index:1;pointer-events:none}
.mini{position:relative;height:22px}
.mini .bar{position:absolute;left:0;right:0;top:6px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--oho),var(--me) 50%,var(--aha))}
.mini .dot{position:absolute;top:1px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;border:3px solid var(--stroke)}
.mini .dot.b{border:2px dashed var(--sub);background:rgba(255,252,244,.7)}
.labels{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.chat{display:flex;flex-direction:column;gap:12px}
.chat .line{display:flex;gap:8px;align-items:flex-end}
.chat .line.me{justify-content:flex-end}
.composer{display:flex;gap:8px;align-items:flex-end}

}

/* 개인정보 가리기 (저장·전송 전에) */
function mask(t){
  let s=String(t||''), hit=false;
  const rules=[
   [/01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}/g,'[전화번호]'],
   [/[\w.+-]+@[\w-]+\.[\w.]+/g,'[이메일]'],
   [/[가-힣]{2,12}(초등학교|중학교|고등학교|여자고등학교|여자중학교|학원)/g,'[학교]'],
   [/(^|[^가-힣])[가-힣]{2,8}(여고|여중|외고|과고|예고|체고|국제고|과학고)(?=[\s,.에을를이가의도]|$)/g,'$1[학교]'],
   [/(^|[^가-힣])[가-힣]{2,6}(초|중|고)(?=\s?(에\s?)?(다녀|다니|다님|학생|에서\s?공부|[1-6]학년))/g,'$1[학교]'],
   [/\d{1,2}학년\s?\d{1,2}반(\s?\d{1,2}번)?/g,'[반]'],
   [/(^|[^가-힣])[가-힣]{1,5}(구|군)\s?[가-힣0-9]{1,5}동(?=[\s,.에]|$)/g,'$1[주소]'],
   [/[가-힣0-9]{1,8}(로|길)\s?\d{1,4}(-\d{1,4})?(번길)?/g,'[주소]'],
   [/[가-힣0-9]{2,12}아파트\s?\d{1,4}동(\s?\d{1,4}호)?/g,'[주소]'],
   [/(^|\s)@[A-Za-z0-9._]{3,}/g,'$1[아이디]']];
  for(const [re,rep] of rules){s=s.replace(re,(...a)=>{hit=true;return rep.replace('$1',typeof a[1]==='string'&&rep.includes('$1')?a[1]:'')})}
  return {text:s,hit};
}

function pdoc(){return S.db.doc('data/users/'+S.uid+'/profile')}
async function boot(){
  try{
    const [db,sample,user,assets]=await Promise.all([window.claude?.use('db'),window.claude?.use('sample'),window.claude?.use('user'),window.claude?.use('assets')]);
    S.db=db||null;S.sample=sample||null;S.assets=assets||null;
    S.uid=user?await user.id():null;
    S.admin=user?await user.canEdit():false;
  }catch(e){}
  if(!S.db||!S.uid){S.loading=false;S.route='nodb';return render()}
  S.dbOK=true;
  try{const p=await pdoc().get();S.profile=p.exists?p.data():null}catch(e){}
  if(!S.profile){S.loading=false;S.route=tutSeen()?'onboard':'door';return render()}
  await afterLogin();
}
async function afterLogin(){
  S.route='home';S.loading=true;render();
  pdoc().collection('reads').onSnapshot(q=>{S.reads={};q.docs.forEach(d=>S.reads[d.id]=d.data());if(!busy())render()},()=>{});
  pdoc().collection('notes').onSnapshot(q=>{S.notes={};q.docs.forEach(d=>S.notes[d.id]=d.data());if(!busy())render()},()=>{});
  pdoc().collection('mine').onSnapshot(q=>{S.mine={};q.docs.forEach(d=>S.mine[d.id]=d.data());if(!busy())render()},()=>{});
  S.db.doc('suggestions/'+S.uid).onSnapshot(d=>{S.mySugg=d.exists?d.data():null;if(!busy())render()},()=>{});
  pdoc().collection('words').onSnapshot(q=>{S.words={};q.docs.forEach(d=>S.words[d.id]=d.data());if(!busy())render()},()=>{});
  pdoc().collection('essays').onSnapshot(q=>{S.essays={};q.docs.forEach(d=>S.essays[d.id]=d.data());if(!busy())render()},()=>{});
  applyFont();
  subscribeNews();
  touchStreak();
}
let newsSubs=[];
function feedKey(k){return k==='loc'?'loc-'+(S.profile&&S.profile.sido||'none'):k}
function subscribeNews(){
  newsSubs.forEach(u=>{try{u()}catch(e){}});newsSubs=[];
  let pending=CATS.length;
  const done=()=>{if(--pending<=0&&S.loading){S.loading=false;if(!busy())render()}};
  CATS.forEach(c=>{
    let first=true;
    newsSubs.push(S.db.doc('news/'+feedKey(c.k)).onSnapshot(sn=>{
      const d=sn.exists?sn.data():null;
      S.news[c.k]=d&&Array.isArray(d.issues)?d.issues.map(x=>Object.assign({},x,{cat:c.k})):[];
      if(first){first=false;done()}else if(!busy())render();
    },()=>{if(first){first=false;done()}}));
  });
  setTimeout(()=>{if(S.loading){S.loading=false;render()}},8000);
}
function busy(){return (S.route==='admin'||S.route==='mineadd'||S.route==='essay')||(['chat','judge1','judge2'].includes(S.route)&&S.flow&&S.flow.typing)}
async function touchStreak(){
  try{
    const p=S.profile,d=new Date(),key=d.toISOString().slice(0,10);
    if(p.lastDay===key)return;
    const y=new Date(d-864e5).toISOString().slice(0,10);
    const streak=p.lastDay===y?(p.streak||0)+1:1;
    const maxStreak=Math.max(p.maxStreak||0,streak);
    const weeks=(p.weeks||0)+(streak%7===0?1:0);
    S.profile=Object.assign({},p,{lastDay:key,streak,maxStreak,weeks});
    await pdoc().update({lastDay:key,streak,maxStreak,weeks});
  }catch(e){}
}
function allIssues(){return CATS.flatMap(c=>S.news[c.k]||[])}
function findIssue(id){return allIssues().find(x=>x.id===id)||(S.mine[id]&&S.mine[id].issue)||(S.reads[id]&&S.reads[id].issue)||null}

/* ============ 화면 전환 ============ */
function go(route,extra){if(route!=='note')S.noteFresh=false;if(!['note','read','essay'].includes(route))S.essayBack=false;Object.assign(S,{route},extra||{});render();window.scrollTo(0,0)}
const STEPS=['읽기','처음 생각','대화','다시 생각','정리'];
function stepper(i){return `<ol class="stepper" aria-label="진행 단계 ${i+1}/${STEPS.length}">${STEPS.map((n,k)=>`<li class="${k<i?'done':k===i?'now':''}" ${k===i?'aria-current="step"':''}><span class="dot">${k<i?'✓':k+1}</span><span class="lb">${n}</span></li>`).join('')}</ol>`}
function render(){
  const v=$('view');
  after=()=>{};
  const map={mineadd:vMineAdd,admin:vAdmin,nodb:vNoDb,onboard:vOnboard,'profile-edit':vOnboard,home:vHome,cats:vCats,preview:vPreview,read:vRead,judge1:vJudge,chat:vChat,judge2:vJudge,note:vNote,port:vPort,my:vMy,essay:vEssay,points:vPoints,door:vDoor,tut:vTut};
  v.innerHTML=(map[S.route]||vHome)();
  const si={read:0,judge1:1,chat:2,judge2:3}[S.route]??(S.route==='note'&&S.noteFresh?4:null);
  if(si!==null&&si!==undefined){const t=v.querySelector('.top');if(t)t.insertAdjacentHTML('afterend',stepper(si))}
  bindCommon();
  const tb=$('tabbar');
  const show=!['nodb','onboard','profile-edit','chat','door','tut'].includes(S.route);
  document.body.classList.toggle('intro',['door','tut'].includes(S.route));
  tb.hidden=!show;
  if(show){
    const cur=['port','note','essay'].includes(S.route)?'port':['my','points'].includes(S.route)?'my':S.route==='admin'?'admin':'home';
    const tabs=[['home','홈',I.home],['port','포트폴리오',I.doc],['my','마이',I.me]];
    if(S.admin)tabs.push(['admin','관리자',I.pen]);
    tb.innerHTML=tabs.map(([r,n,ic])=>`<button type="button" data-go="${r}" ${cur===r?'aria-current="page"':''}><span class="ic">${ic}</span>${n}</button>`).join('');
    tb.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go,{cat:'all'}));
  }
  after();
  if(!['onboard','profile-edit','nodb'].includes(S.route))checkBadges();
}
let after=()=>{};
function bindCommon(){
  document.querySelectorAll('[data-go]').forEach(b=>{if(!b.closest('#tabbar'))b.onclick=()=>go(b.dataset.go)});
  document.querySelectorAll('[data-issue]').forEach(b=>b.onclick=()=>openIssue(b.dataset.issue));
  document.querySelectorAll('[data-gocat]').forEach(b=>b.onclick=()=>go('cats',{cat:b.dataset.gocat,more:false}));
}
function topBar(title,back){if(S.essayBack&&S.essay&&['note','read'].includes(S.route))back='essay';return `<div class="top"><button type="button" class="iconbtn" aria-label="뒤로" data-go="${back||'home'}">${I.back}</button><div class="title">${esc(title)}</div></div>`}

async function saveProfile(){
  const f=S.form;
  if(!f.nick.trim())return toast('닉네임을 적어줘');
  if(!f.sido)return toast('사는 시·도를 골라줘');
  if(!f.age)return toast('연령대를 골라줘');
  if(!f.consent)return toast('동의 항목을 확인해줘');
  const m=mask(f.nick.trim());
  const data=Object.assign({},S.profile||{},{nick:m.text.slice(0,16),sido:f.sido,age:f.age,gender:f.gender||'',consent:true,updatedAt:new Date().toISOString()});
  if(!S.profile)data.createdAt=data.updatedAt;
  try{
    await pdoc().set(data);
    S.profile=data;S.form=null;
    try{await S.db.doc('regions/'+f.sido).set({sido:SIDON[f.sido],active:true,updatedAt:data.updatedAt})}catch(e){}
    if(S.route==='profile-edit'){toast('저장했어');subscribeNews();go('my')}else await afterLogin();
  }catch(e){toast('저장하지 못했어. 잠시 뒤 다시 해줘')}
}

function editionLabel(){
  const ts=allIssues().map(x=>x.addedAt||'').sort().pop();
  if(!ts)return '';
  const n=allIssues().filter(x=>Date.now()-Date.parse(x.addedAt||0)<864e5).length;
  const d=new Date(ts);return esc(n?`새 소식 ${n}개`:`${d.getMonth()+1}/${d.getDate()} 업데이트`);
}
function editedTag(x){if(!x.editedAt)return '';const d=new Date(x.editedAt);return ` · 수정됨 ${d.getMonth()+1}/${d.getDate()}`}
function photo(x){return x.photo?'/_blob/'+encodeURIComponent(x.photo):''}

function chatTurns(){
  const f=S.flow,x=S.issue,out=[{role:'user',content:OHO_RULES(x)}];
  f.turns.forEach(t=>{if(t.role==='me')out.push({role:'user',content:t.text});else if(t.role==='oho'&&t.text)out.push({role:'assistant',content:t.text})});
  if(out[out.length-1].role!=='user')out.push({role:'user',content:'(계속해줘)'});
  return out;
}
function scriptedOho(){
  const f=S.flow,x=S.issue,n=f.ohoCount;
  if(n===0){const v=f.before[0];const pos=v<40?(x.stance&&x.stance[0]?x.stance[0].left:'반대'):v>60?(x.stance&&x.stance[0]?x.stance[0].right:'찬성'):'가운데';return `기사 읽고 '${pos}' 쪽에 가깝다고 짚었지? 왜 그렇게 생각했어?`}
  const op=(x.opinions||[])[0],o2=(x.outlets||[])[1];
  if(op)return `좋은 이유야! 그런데 ${op.holder||'어떤 사람들'}은 "${op.text}"라고 봤대. 그 입장이라면 뭐라고 할까?`;
  if(o2)return `좋은 이유야! 그런데 ${o2.name}은 이렇게 봤어: ${o2.point} 그 시선으로 보면 어때?`;
  return '좋은 이유야! 그럼 너와 반대로 생각하는 친구는 어떤 이유를 댈까?';
}
function scriptedAha(){
  const f=S.flow,x=S.issue,mine=f.turns.filter(t=>t.role==='me').map(t=>t.text);
  const cut=t=>String(t||'').slice(0,90);
  return {my_view:cut(mine[0])||'아직 적지 않았어.',new_view:cut(mine[1])||'다른 입장을 한 번 더 떠올려보면 좋겠어.',
    facts:(x.facts||[]).slice(0,2),opinions:mine[0]?[{text:cut(mine[0]),holder:'너의 생각'}]:[],
    open_question:(x.outlets||[]).length>1?'언론사마다 다르게 본 이유는 뭘까?':'다른 언론사는 이 소식을 어떻게 다뤘을까?'};
}
async function ohoAsk(){
  const f=S.flow;
  if(!S.sample||f.noAI){f.typing=true;f.turns.push({role:'oho',text:''});render();await new Promise(r=>setTimeout(r,700));f.turns[f.turns.length-1].text=scriptedOho();f.ohoCount++;f.typing=false;return render()}
  const turn={role:'oho',text:''};f.turns.push(turn);f.typing=true;render();
  try{
    const r=await S.sample(chatTurns(),{modelTier:'quick',cache:false,onText:({text})=>{turn.text=noSelfName(text);const b=document.querySelectorAll('.bubble.o');const last=b[b.length-1];if(last)last.textContent=turn.text}});
    turn.text=noSelfName(r.text);f.ohoCount++;
  }catch(e){
    f.turns.pop();
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)){f.noAI=true;f.typing=false;return ohoAsk()}
    else toast(e.code==='rate_limited'?'잠깐 쉬었다가 다시 해줘':'오호가 대답하지 못했어. 다시 보내줘');
  }
  f.typing=false;render();
}
async function sendMsg(){
  const f=S.flow;const raw=(f.draft||'').trim();if(!raw||f.typing)return;
  if(RISK.test(raw)){f.draft='';helpSheet();return}
  const m=mask(raw);f.draft='';
  f.turns.push({role:'me',text:m.text});
  if(m.hit)toast('개인정보로 보이는 부분을 가렸어');
  if(f.ohoCount>=(f.limit||2)){render();return askAha()}
  await ohoAsk();
}

async function askAha(){
  const f=S.flow,x=S.issue;
  const t={role:'aha',data:null};f.turns.push(t);f.typing=true;render();
  if(!S.sample||f.noAI){await new Promise(r=>setTimeout(r,800));t.data=scriptedAha();f.typing=false;return render()}
  const convo=f.turns.filter(u=>u.role!=='aha').map(u=>(u.role==='me'?'사용자: ':'오호: ')+u.text).join('\n');
  const prompt=`너는 청소년 뉴스 앱 '원더래빗'의 캐릭터 '아하'야. 민트색 느낌표 귀를 가진 토끼로, 맑고 중립적이야.
아래 대화에서 사용자의 생각을 정리해. 사용자의 말에 가깝게 쓰고, 없는 생각을 덧붙이지 마. 평가하지 마("좋은 생각" 금지). 반말.
facts는 반드시 아래 기사 정보의 사실에서만 가져와. opinions에는 사용자의 의견을 holder "너의 생각"으로 넣고, 기사 속 의견이 있으면 그 주체와 함께 넣어.
어떤 정치 성향이나 입장이 옳다고 하지 마.

[기사 정보]
${issueBrief(x)}

[대화]
${convo}

오직 이 JSON 하나로만 답해:
{"my_view":"한 문장","new_view":"대화에서 새로 떠올린 관점 한 문장","facts":["사실 1~2개"],"opinions":[{"text":"의견","holder":"누구의 의견"}],"open_question":"아직 남은 궁금증 한 문장, 질문형"}`;
  try{t.data=await S.sample.json(prompt,{modelTier:'default',cache:false})}
  catch(e){f.turns.pop();toast(e.code==='rate_limited'?'잠깐 쉬었다가 다시 해줘':'아하가 정리하지 못했어. 다시 눌러줘')}
  f.typing=false;render();
}

async function finish(){
  const x=S.issue,f=S.flow;
  const aha=(f.turns||[]).slice().reverse().find(t=>t.role==='aha'&&t.data);
  const moved=f.after.some((v,i)=>Math.abs(v-f.before[i])>=10);
  const note={issueId:x.id,title:x.title,cat:x.cat,edition:x.edition||'',date:today(),createdAt:new Date().toISOString(),
    stance:(x.stance||[]).slice(0,2),before:f.before,after:f.after,
    oho:(f.turns||[]).filter(t=>t.role==='oho'&&t.text).map(t=>t.text),
    chat:(f.turns||[]).filter(t=>t.role!=='aha').map(t=>({role:t.role,text:t.text})),
    aha:aha?aha.data:null,line:f.line||'',result:moved?'moved':'more_reasons',
    outlets:(x.outlets||[]).map(o=>({name:o.name,point:o.point,url:o.url,title:o.title}))};
  const prev=S.notes[x.id];
  const round=r=>({date:r.date,createdAt:r.createdAt,before:r.before,after:r.after,line:r.line||'',aha:r.aha||null,oho:r.oho||[],chat:r.chat||[],result:r.result});
  const rounds=prev?(Array.isArray(prev.rounds)&&prev.rounds.length?prev.rounds.slice():[round(prev)]):[];
  rounds.push(round(note));
  note.rounds=rounds;note.firstAt=prev?(prev.firstAt||rounds[0].createdAt):note.createdAt;
  const dayKey=r=>String(r.createdAt||'').slice(0,10);
  const newDay=prev&&!rounds.slice(0,-1).some(r=>dayKey(r)===dayKey(note));
  try{
    await pdoc().collection('notes').doc(x.id).set(note);
    if(!prev)await recordStat(x,f.before,f.after);
    S.note=note;S.noteFresh=true;
    if(!prev)pointPop(10+(note.line?5:0),note.line?'생각 노트 + 한 줄 평':'생각 정리 노트');
    else if(newDay)pointPop(5,`다시 생각하기 · ${rounds.length}번째`);
    else toast(`${rounds.length}번째 생각을 기록했어 (같은 날은 포인트 한 번)`);
    go('note');
  }catch(e){toast('저장하지 못했어. 다시 눌러줘')}
}
function nextRecs(n){
  const unread=allIssues().filter(x=>x.id!==n.issueId&&!S.reads[x.id]);
  const readCats=new Set(Object.values(S.reads).map(r=>r.cat));
  const other=unread.filter(x=>x.cat!==n.cat).sort((a,b)=>(readCats.has(a.cat)?1:0)-(readCats.has(b.cat)?1:0))[0];
  const same=unread.find(x=>x.cat===n.cat);
  const recs=[other&&{x:other,why:readCats.has(other.cat)?'다른 분야 소식':'아직 안 가 본 분야'},same&&{x:same,why:'같은 분야 다른 소식'}].filter(Boolean);
  if(!recs.length)return `<div class="card" style="flex-direction:row;align-items:center;gap:12px;background:var(--aha-tint);border:0">${rabbit('aha',64,'aha_thumbs')}<p style="font-size:15px">올라온 뉴스를 다 읽었어! 새 소식이 오면 홈에서 알려줄게.</p></div>`;
  return `<div class="card" style="gap:10px"><div class="row" style="gap:10px;align-items:center">${rabbit('aha',56,'aha_next')}<h3>다음엔 이걸 읽어볼까?</h3></div>
   ${recs.map(r=>`<button type="button" class="news" data-issue="${esc(r.x.id)}" style="text-align:left"><span class="thumb" style="background:${art(r.x.cat,30).bg}">${art(r.x.cat,30).svg}</span><span class="body"><span class="muted">${esc(r.why)} · ${esc(CATN[r.x.cat]||'')}${(r.x.outlets||[]).length>1?` · 언론사 ${r.x.outlets.length}곳 비교`:''}</span><span class="t">${esc(r.x.title)}</span></span></button>`).join('')}</div>`;
}
function fmtDay(iso){if(!iso)return '';const d=new Date(iso);return `${d.getMonth()+1}월 ${d.getDate()}일`}
function roundsOf(n){return Array.isArray(n.rounds)&&n.rounds.length?n.rounds:[n]}
/* 같은 기사로 여러 번 생각했을 때: 첫 생각(점선) → 1·2·3차 대화 후 위치를 번호 점으로 */
function timelineTrack(n,qi){
  const rs=roundsOf(n);const q=(n.stance||[])[qi];if(!q)return '';
  const first=(rs[0].before||[])[qi];
  return `<div class="tl"><div class="bar"></div>${first!=null?`<span class="dot b" style="left:${first}%" title="처음 읽은 직후"></span>`:''}${rs.map((r,i)=>{const v=(r.after||[])[qi];return v==null?'':`<span class="tldot ${i===rs.length-1?'last':''}" style="left:${v}%" title="${i+1}번째 · ${esc(fmtDay(r.createdAt))}">${i+1}</span>`}).join('')}</div>`;
}
function miniTrack(b,a){return `<div class="mini"><div class="bar"></div><span class="dot b" style="left:${b}%"></span><span class="dot" style="left:${a}%"></span></div>`}

  const tab=S.ptab||'notes';
  after=()=>{
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.ptab=b.dataset.tab;S.reveal=false;render()});
    document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{S.note=S.notes[b.dataset.note];go('note')});
    const rv=$('reveal');if(rv)rv.onclick=()=>{S.reveal=true;render()};
    document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rateWord(b.dataset.w,b.dataset.rate==='know'));
    document.querySelectorAll('[data-delw]').forEach(b=>b.onclick=()=>deleteWord(b.dataset.delw));
    document.querySelectorAll('[data-dell]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();deleteLine(b.dataset.dell)});
    document.querySelectorAll('[data-delm]').forEach(b=>b.onclick=()=>{S.delMine=S.delMine===b.dataset.delm?null:b.dataset.delm;render()});

  <div class="tabs grid3" role="tablist">${[['notes','생각 기록'],['reads','읽은 기사'],['mine','가져온 뉴스'],['words','단어장'],['lines','한 줄 평'],['essays','에세이']].map(([k,n])=>`<button type="button" role="tab" aria-selected="${tab===k}" data-tab="${k}" style="font-size:13px;white-space:nowrap;min-width:64px">${n}</button>`).join('')}</div>${body}`;

async function deleteLine(id){
  const n=S.notes[id];if(!n)return;
  S.pick=(S.pick||[]).filter(k=>k!==id);
  try{await pdoc().collection('notes').doc(id).update({line:''});toast('한 줄 평을 지웠어. 생각 정리 노트는 그대로 있어')}catch(e){toast('지우지 못했어')}
}
async function deleteWord(id){
  const w=S.words[id];if(!w)return;
  S.reveal=false;
  try{await pdoc().collection('words').doc(id).delete();toast(`'${w.term}'을(를) 단어장에서 지웠어`)}catch(e){toast('지우지 못했어')}
}
async function deleteMine(id){
  S.delMine=null;
  try{
    await pdoc().collection('mine').doc(id).delete();
    const items=(S.mySugg&&S.mySugg.items)||[];
    if(items.some(i=>i.id===id&&i.status==='pending')){
      const rest=items.filter(i=>!(i.id===id&&i.status==='pending'));
      await S.db.doc('suggestions/'+S.uid).set({items:rest,updatedAt:new Date().toISOString()});
    }
    toast('가져온 기사를 지웠어');
  }catch(e){toast('지우지 못했어')}
}
async function rateWord(id,know){
  const w=S.words[id];if(!w)return;
  const box=know?Math.min((w.box||0)+1,4):0;
  const days=[0,1,3,7,14][box];
  const next=new Date(Date.now()+Math.max(days,know?1:0)*864e5).toISOString().slice(0,10);
  S.reveal=false;
  try{await pdoc().collection('words').doc(id).update({box,next})}catch(e){toast('저장하지 못했어')}
}

async function wipeAll(){
  try{
    for(const col of ['reads','notes','words','mine','essays']){const q=await pdoc().collection(col).get();await Promise.all(q.docs.map(d=>pdoc().collection(col).doc(d.id).delete()))}
    await pdoc().delete();
    try{await S.db.doc('suggestions/'+S.uid).delete()}catch(e){}
    S.profile=null;S.reads={};S.notes={};S.words={};S.essays={};S.pick=[];S.wipe=false;document.documentElement.style.setProperty('--zoom',1);S.form=null;go('onboard');

const GEN_RULES=`너는 청소년(초등 고학년~고등학생)을 위한 뉴스 앱 '원더래빗'의 편집 AI야.
아래 [기사들]만 근거로 JSON을 만들어. 기사가 1개일 수도, 같은 사건을 다룬 서로 다른 언론사 기사 여러 개일 수도 있어.

[원더래빗 뉴스 원칙 - 먼저 검사해서 screen에 적어]
1. 언론사가 사실을 취재해 쓴 기사여야 한다. 블로그·커뮤니티 글·광고·소설·잡담이면 위반.
2. 성별·지역·출신·국적·장애·종교·나이·외모로 사람이나 집단을 비하하는 혐오 표현이 중심이면 위반.
3. 특정 집단이나 진영을 적으로 몰거나 분노·조롱·비방을 부추기는 것이 중심이면 위반.
4. 선정적·잔인한 묘사가 중심이거나, 도박·성인물·자해 방법 등 청소년이 따라 하면 위험한 내용을 자세히 담으면 위반.
5. 일반인(공인이 아닌 사람)의 실명·연락처·주소를 드러내는 것이 중심이면 위반.
사건 자체가 무겁거나 논쟁적이라는 이유만으로 위반은 아니다(정치·사회 갈등을 사실대로 전하는 기사는 통과). 위반이면 screen.ok=false, reasons에 청소년이 이해할 쉬운 말로 이유를 쓰고, 다른 필드는 빈 값으로 둬.

[작성 원칙]
- 어떤 정치 성향, 정당, 인물, 입장이 옳다고 판단하거나 암시하지 않는다.
- 자극적 표현 금지(충격, 논란 폭발, 발칵, 경악, 역대급 등). 진영 낙인어·비하어 금지.
- 기사에 없는 숫자, 인용, 사실을 만들지 않는다. 기사끼리 숫자가 다르면 facts에 둘 다 쓰고 "기사마다 숫자가 달라요"라고 밝힌다.
- 기사 문장을 그대로 베끼지 말고 쉬운 말로 새로 쓴다.
- 문장은 해요체("~했어요"). hook과 stance의 질문은 반말.

[필드 규칙]
- title: 중립적인 이슈 제목, 25자 이내. sub: 카드 부제 한 줄, 40자 이내.
- hook: '오호의 궁금증'. 읽고 싶게 만드는 질문 한 문장, 30자 이내, 반말. 과장·결론 암시·한쪽 유도 금지.
- summary1 + summary2: 합쳐서 3~4문장, 200자 이내. 초등학생도 이해할 쉬운 문장. summary1은 사건의 핵심 1~2문장, summary2는 반응·걱정·앞으로의 일 1~2문장.
- glossary: summary에 실제로 쓴 어려운 낱말 2~4개. term은 요약 속 글자 그대로. meaning은 25자 내외 쉬운 뜻, example은 쉬운 예문.
- quiz: summary1 내용만으로 풀 수 있는 사실 확인 3지선다. 함정 금지. answer는 정답 번호(0부터). explain은 한 문장.
- common: 기사가 여러 개면 모두 공통으로 짚은 사실 한 문장, 1개면 "".
- outlets: 입력한 기사 순서 그대로. 각 언론사가 "무엇을 먼저 다뤘는지"만 한 문장(40자 이내), "○○을 먼저 다뤘어요." 형식. 평가하지 않는다.
- facts: 확인 가능한 사실 1~3개. opinions: 기사 속 의견·전망·걱정 0~3개, holder에 누구의 의견인지.
- keywords: 3개(띄어쓰기·# 없이). interests: 연관 관심사 2개.
- cat_check: [분야]가 이 기사의 중심 내용에 맞는지 본다. 맞으면 fit=true, better="", why="". 확실히 다른 분야가 더 맞을 때만 fit=false, better에 [분야 목록]의 코드 하나, why에 청소년이 이해할 쉬운 이유 한 문장(해요체, 40자 이내). 애매하면 fit=true.
- same_event: [이미 올린 뉴스] 목록이 있으면, 그중 이 기사와 같은 사건(같은 일·발표·사고·결정)을 다룬 것이 있는지 본다. 확실히 같을 때만 id에 그 id, why에 쉬운 이유 한 문장(해요체). 주제만 비슷하거나 목록이 없으면 id="".
- stance: 슬라이더 질문 2개. 1번은 찬반 정도(left "반대해", mid "잘 모르겠어", right "찬성해"). 2번은 두 가치의 우선순위나 원인(개인의 선택 ↔ 사회 구조) 중 이슈에 맞는 것, mid는 "". 양쪽 라벨 모두 긍정적이거나 둘 다 타당해야 한다. 질문은 30자 이내.

오직 이 JSON 하나로만 답해:
{"screen":{"ok":true,"reasons":[]},"title":"","sub":"","hook":"","summary1":"","summary2":"","glossary":[{"term":"","meaning":"","example":""}],"quiz":{"q":"","options":["","",""],"answer":0,"explain":""},"common":"","outlets":[{"name":"","point":""}],"facts":[""],"opinions":[{"text":"","holder":""}],"keywords":["","",""],"interests":["",""],"stance":[{"q":"","left":"반대해","mid":"잘 모르겠어","right":"찬성해"},{"q":"","left":"","mid":"","right":""}],"cat_check":{"fit":true,"better":"","why":""},"same_event":{"id":"","why":""}}`;
async function generateIssue(F){
  const arts=F.arts.map(a=>({outlet:a.outlet.trim(),url:a.url.trim(),title:a.title.trim(),text:a.text.trim()})).filter(a=>a.outlet||a.text||a.url);
  if(!arts.length)return toast('기사를 하나 이상 넣어줘');
  for(const a of arts){
    if(!a.outlet)return toast('언론사 이름을 적어줘');
    if(!a.url||!okUrl(a.url))return toast(`${a.outlet} 기사 링크를 https://로 시작하게 넣어줘`);
    if(!a.text||a.text.length<80)return toast(`${a.outlet} 기사 본문을 조금 더 붙여넣어줘`);
  }
  const names=arts.map(a=>a.outlet);if(new Set(names).size!==names.length)return toast('서로 다른 언론사 기사를 넣어줘');
  const per=Math.floor(18000/arts.length);
  const prompt=GEN_RULES+`\n\n[분야] ${CATN[F.cat]}${F.cat==='loc'?' ('+SIDON[F.sido]+')':''}\n[분야 목록] ${CATS.filter(c=>c.k!=='loc').map(c=>c.k+'='+c.n).join(', ')}${F.mode==='admin'&&sameCandidates(F.cat).length?`\n\n[이미 올린 뉴스]\n${candidateText(sameCandidates(F.cat))}`:''}\n\n[기사들]\n`+arts.map((a,i)=>`--- 기사 ${i+1} ---\n언론사: ${a.outlet}\n제목: ${a.title}\n본문:\n${a.text.slice(0,per)}`).join('\n\n');
  F.busy=true;F.gen=null;F.blocked=null;F.hint=null;F.same=null;render();
  try{
    const r=await S.sample.json(prompt,{modelTier:'default',cache:false});
    if(r&&r.screen&&r.screen.ok===false){F.blocked={reasons:Array.isArray(r.screen.reasons)?r.screen.reasons.map(String).slice(0,3):[]}}
    else{F.gen=normalizeIssue(r,arts);F.hint=catHint(r,F.cat);if(F.mode==='admin'){F.same=sameHint(r,F.cat,arts.map(a=>a.outlet));if(F.same)F.same.cat=F.cat}}
  }catch(e){toast(e.code==='invalid_json'?'결과가 이상하게 나왔어. 다시 눌러줘':e.code==='prompt_too_large'?'본문이 너무 길어. 핵심 문단만 넣어줘':e.code==='rate_limited'?'잠깐 쉬었다가 다시 해줘':e.code==='refused'?'이 글은 분석할 수 없어. 다른 기사로 해줘':'만들지 못했어. 다시 눌러줘')}
  F.busy=false;render();
}
function normalizeIssue(r,arts){
  const str=v=>typeof v==='string'?v.trim():'';
  const arr=v=>Array.isArray(v)?v:[];
  const q=r&&r.quiz||{};
  const opts=arr(q.options).map(str).filter(Boolean).slice(0,3);
  const x={title:str(r.title),sub:str(r.sub),hook:str(r.hook),summary1:str(r.summary1),summary2:str(r.summary2),
    glossary:arr(r.glossary).map(g=>({term:str(g&&g.term),meaning:str(g&&g.meaning),example:str(g&&g.example)})).filter(g=>g.term&&g.meaning).slice(0,4),
    quiz:opts.length===3&&str(q.q)?{q:str(q.q),options:opts,answer:Math.max(0,Math.min(2,parseInt(q.answer,10)||0)),explain:str(q.explain)}:null,
    common:arts.length>1?str(r.common):'',
    outlets:arts.map((a,i)=>{const o=arr(r.outlets)[i]||{};return {name:a.outlet,point:str(o.point),url:a.url,title:a.title}}),
    facts:arr(r.facts).map(str).filter(Boolean).slice(0,3),
    opinions:arr(r.opinions).map(o=>({text:str(o&&o.text),holder:str(o&&o.holder)})).filter(o=>o.text).slice(0,3),
    keywords:arr(r.keywords).map(k=>str(k).replace(/^#/,'').replace(/\s+/g,'')).filter(Boolean).slice(0,3),
    interests:arr(r.interests).map(k=>str(k).replace(/^#/,'').replace(/\s+/g,'')).filter(Boolean).slice(0,2),
    stance:arr(r.stance).slice(0,2).map(s=>({q:str(s&&s.q),left:str(s&&s.left)||'반대해',mid:str(s&&s.mid),right:str(s&&s.right)||'찬성해'})).filter(s=>s.q),
    screened:true};
  if(!x.title||!x.summary1)throw {code:'invalid_json'};
  if(!x.quiz)delete x.quiz;
  return x;
}
function catHint(r,cur){
  const c=r&&r.cat_check;if(!c||c.fit!==false||cur==='loc')return null;
  const k=String(c.better||'').trim();
  if(!CATN[k]||k===cur||k==='loc')return null;
  return {k,why:String(c.why||'').trim().slice(0,80),done:false};
}
function hintCard(F){
  const h=F.hint;if(!h||h.done)return '';
  return `<div class="card" style="background:var(--aha-tint);border:2px solid var(--aha-ink);gap:10px"><div class="row" style="align-items:flex-start;gap:10px">${rabbit('aha',64,'aha_next')}<div style="display:flex;flex-direction:column;gap:4px"><span class="who a" style="font-size:16px">잠깐! 분야를 바꿀까?</span><p style="font-size:14px">이 기사는 '${esc(CATN[F.cat])}'보다 <b>'${esc(CATN[h.k])}'</b>에 더 가까워 보여.${h.why?' '+esc(h.why):''}</p></div></div>
   <div class="row"><button type="button" class="btn ghost" id="hintno" style="flex:1">그대로 둘래</button><button type="button" class="btn mint" id="hintyes" style="flex:1">바꿀래</button></div></div>`;
}
async function pushToFeed(cat,sido,x){
  const key=cat==='loc'?'loc-'+sido:cat;
  const ref=S.db.doc('news/'+key);
  const cur=await ref.get();
  const list=cur.exists&&Array.isArray(cur.data().issues)?cur.data().issues.slice():[];
  list.unshift(x);
  await ref.set({cat,updatedAt:new Date().toISOString(),issues:list.slice(0,40)});
}

async function saveAdminIssue(F){
  if(!F.gen||F.busy)return;
  if(F.same&&!F.same.done)return toast('묶을지 먼저 골라줘');
  if(F.hint&&!F.hint.done)return toast('분야를 바꿀지 먼저 골라줘');
  const x=Object.assign({},F.gen);F.busy=true;render();
  try{
    if(F.file&&S.assets){const up=await S.assets.upload(F.file);x.photo=up.id;x.photoCredit=x.outlets[0]?x.outlets[0].name:''}
    x.id=(F.cat==='loc'?'loc-'+F.sido:F.cat)+'-'+Date.now().toString(36);
    x.addedAt=new Date().toISOString();if(F.cat==='loc')x.region=F.sido;
    await pushToFeed(F.cat,F.sido,x);

  }catch(e){F.busy=false;toast(e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼어. 오래된 뉴스를 지워줘':'올리지 못했어. 다시 눌러줘')}

}
async function deleteIssue(ref){
  const [cat,id]=String(ref).split('|');
  const key=feedKey(cat);
  try{
    const d=S.db.doc('news/'+key);const cur=await d.get();
    const all=cur.exists?(cur.data().issues||[]):[];
    const gone=all.find(x=>x.id===id);
    await d.set({cat,updatedAt:new Date().toISOString(),issues:all.filter(x=>x.id!==id)});
    if(gone&&gone.photo&&S.assets){try{await S.assets.delete(gone.photo)}catch(e){}}
    S.confirmDel=null;toast('삭제했어');
  }catch(e){toast('삭제하지 못했어')}
  render();
}
async function loadSuggestions(){
  try{
    const q=await S.db.collection('suggestions').get();
    const out=[];
    q.docs.forEach(d=>{const v=d.data()||{};(v.items||[]).forEach(it=>out.push({user:d.id,key:d.id+'|'+it.id,item:it}))});
    out.sort((a,b)=>(b.item.at||'').localeCompare(a.item.at||''));
    S.sugg=out;
  }catch(e){S.sugg=[];toast('추천 목록을 불러오지 못했어')}
  if(S.route==='admin')render();
}
async function decideSuggestion(key,ok,cat,skipCheck){
  if(ok&&!skipCheck){
    const sv=(S.sugg||[]).find(v=>v.key===key);const c=cat&&CATN[cat]?cat:(sv?sv.item.issue.cat:null);
    S.suggChecking=key;render();
    const h=c?await checkSuggSame(key,c):null;
    S.suggChecking=null;
    if(h){S.suggSame=Object.assign({},S.suggSame,{[key]:Object.assign(h,{cat:c})});return render()}
  }
  const [user,id]=String(key).split('|');
  try{
    const ref=S.db.doc('suggestions/'+user);const cur=await ref.get();if(!cur.exists)return;
    const items=(cur.data().items||[]).map(it=>Object.assign({},it));
    const it=items.find(i=>i.id===id);if(!it)return;
    if(ok){
      const c=cat&&CATN[cat]?cat:it.issue.cat;
      const x=Object.assign({},it.issue,{cat:c,id:(c==='loc'?'loc-'+(it.issue.region||'seoul'):c)+'-r'+Date.now().toString(36),addedAt:new Date().toISOString(),recommended:true});
      delete x.mine;delete x.catHint;
      if(c!==it.issue.cat)x.catFrom=it.issue.cat;
      await pushToFeed(x.cat,x.region||'seoul',x);
    }
    it.status=ok?'approved':'held';it.decidedAt=new Date().toISOString();
    await ref.set({items,updatedAt:it.decidedAt});
    toast(ok?'모두에게 공개했어':'보류했어');
  }catch(e){toast('처리하지 못했어')}
  loadSuggestions();
}

function syncEditor(E){
  const v=id=>{const el=$(id);return el?el.value.trim():null};
  const x=E.x;if(!$('e_title'))return;
  const c=v('e_cat');if(c)E.cat=c;const sd=v('e_sido');if(sd)E.sido=sd;
  x.title=v('e_title');x.sub=v('e_sub');x.hook=v('e_hook');x.summary1=v('e_s1');x.summary2=v('e_s2');
  x.glossary=(x.glossary||[]).map((t,i)=>({term:v('e_gt'+i)||'',meaning:v('e_gm'+i)||'',example:v('e_ge'+i)||''}));
  const ans=document.querySelector('input[name="e_qa"]:checked');
  x.quiz={q:v('e_qq')||'',options:[0,1,2].map(i=>v('e_qo'+i)||''),answer:ans?+ans.value:0,explain:v('e_qx')||''};
  if($('e_common'))x.common=v('e_common');
  x.outlets=(x.outlets||[]).map((o,i)=>({name:v('e_on'+i)||'',url:v('e_ou'+i)||'',title:v('e_ot'+i)||'',point:v('e_op'+i)||''}));
  x.facts=(v('e_facts')||'').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,5);
  x.opinions=(v('e_ops')||'').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,5).map(s=>{const k=s.lastIndexOf(' / ');return k>0?{text:s.slice(0,k).trim(),holder:s.slice(k+3).trim()}:{text:s,holder:''}});
  const list=s=>(s||'').split(',').map(t=>t.trim().replace(/^#/,'').replace(/\s+/g,'')).filter(Boolean);
  x.keywords=list(v('e_kw')).slice(0,5);x.interests=list(v('e_in')).slice(0,3);
  x.stance=[0,1].map(i=>({q:v('e_sq'+i)||'',left:v('e_sl'+i)||'',mid:v('e_sm'+i)||'',right:v('e_sr'+i)||''})).filter(s=>s.q);
}
function checkEdited(x){
  if(!x.title)return '제목을 적어줘';
  if(!x.summary1)return '요약 앞부분을 적어줘';
  if(!(x.outlets||[]).length||x.outlets.some(o=>!o.name))return '언론사 이름을 적어줘';
  if(x.outlets.some(o=>o.url&&!okUrl(o.url)))return '링크는 https://로 시작해야 해';
  if(x.quiz&&x.quiz.q&&x.quiz.options.some(o=>!o))return '퀴즈 보기 3개를 모두 채워줘';
  if(x.stance.some(s=>!s.left||!s.right))return '슬라이더 양쪽 끝 말을 채워줘';
  if((x.glossary||[]).some(g=>!g.term||!g.meaning))return '어려운 말의 낱말과 뜻을 채워줘';
  return '';
}
function cleanEdited(x){
  const y=Object.assign({},x);
  y.glossary=(y.glossary||[]).filter(g=>g.term&&g.meaning);
  if(!y.quiz||!y.quiz.q)delete y.quiz;
  if((y.outlets||[]).length<2)y.common='';
  return y;
}
function bindEditor(E,onSave,onCancel){
  const keep=fn=>()=>{syncEditor(E);fn();render()};
  const ga=$('e_gadd');if(ga)ga.onclick=keep(()=>{E.x.glossary=(E.x.glossary||[]).concat([{term:'',meaning:'',example:''}])});
  document.querySelectorAll('[data-gdel]').forEach(b=>b.onclick=keep(()=>{E.x.glossary.splice(+b.dataset.gdel,1)}));
  const ec=$('e_cat');if(ec)ec.onchange=keep(()=>{});
  const fi=$('e_file');if(fi)fi.onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast('사진 파일만 올릴 수 있어');syncEditor(E);E.file=f;if(E.fileUrl)URL.revokeObjectURL(E.fileUrl);E.fileUrl=URL.createObjectURL(f);E.removePhoto=false;render()};
  const pr=$('e_prm');if(pr)pr.onclick=keep(()=>{E.file=null;E.fileUrl='';E.removePhoto=true});
  const sv=$('e_save');if(sv)sv.onclick=()=>{syncEditor(E);const m=checkEdited(E.x);if(m)return toast(m);onSave()};
  const cn=$('e_cancel');if(cn)cn.onclick=onCancel;
}

async function regenIssue(){
  const E=S.edit;
  const arts=E.x.outlets.map((o,i)=>({outlet:o.name,url:o.url,title:o.title,text:(E.texts[i]||'').trim()}));
  const missing=arts.find(a=>a.text.length<80);if(missing)return toast(`${missing.outlet} 본문을 조금 더 붙여넣어줘`);
  const per=Math.floor(18000/arts.length);
  const prompt=GEN_RULES+`\n\n[분야] ${CATN[E.cat]}${E.cat==='loc'?' ('+SIDON[E.sido]+')':''}\n\n[기사들]\n`+arts.map((a,i)=>`--- 기사 ${i+1} ---\n언론사: ${a.outlet}\n제목: ${a.title}\n본문:\n${a.text.slice(0,per)}`).join('\n\n');
  E.busy=true;E.blocked=null;render();
  try{
    const r=await S.sample.json(prompt,{modelTier:'default',cache:false});
    if(r&&r.screen&&r.screen.ok===false)E.blocked={reasons:Array.isArray(r.screen.reasons)?r.screen.reasons.map(String).slice(0,3):[]};
    else{const n=normalizeIssue(r,arts);E.x=Object.assign({},E.x,n,{id:E.x.id,addedAt:E.x.addedAt,photo:E.x.photo,photoCredit:E.x.photoCredit,recommended:E.x.recommended});if(!n.quiz)delete E.x.quiz;E.regen=false;E.texts=E.x.outlets.map(()=>'');toast('새로 만들었어. 확인하고 저장해줘')}
  }catch(e){toast(e.code==='prompt_too_large'?'본문이 너무 길어. 핵심 문단만 넣어줘':e.code==='rate_limited'?'잠깐 쉬었다가 다시 해줘':'만들지 못했어. 다시 눌러줘')}
  E.busy=false;render();window.scrollTo(0,0);
}
async function saveEdit(){
  const E=S.edit;if(E.busy)return;
  E.busy=true;render();
  try{
    const x=cleanEdited(E.x);
    x.editedAt=new Date().toISOString();
    if(E.cat==='loc')x.region=E.sido;else delete x.region;
    let oldPhoto=null;
    if(E.file&&S.assets){const up=await S.assets.upload(E.file);oldPhoto=x.photo||null;x.photo=up.id;x.photoCredit=x.outlets[0]?x.outlets[0].name:''}
    else if(E.removePhoto&&x.photo){oldPhoto=x.photo;delete x.photo;delete x.photoCredit}
    const oldKey=E.origCat==='loc'?'loc-'+E.origSido:E.origCat;
    const newKey=E.cat==='loc'?'loc-'+E.sido:E.cat;
    if(oldKey===newKey){
      const ref=S.db.doc('news/'+newKey);const cur=await ref.get();
      const list=(cur.exists?cur.data().issues||[]:[]).map(i=>i.id===x.id?x:i);
      await ref.set({cat:E.cat,updatedAt:x.editedAt,issues:list});
    }else{
      const oref=S.db.doc('news/'+oldKey);const ocur=await oref.get();
      await oref.set({cat:E.origCat,updatedAt:x.editedAt,issues:(ocur.exists?ocur.data().issues||[]:[]).filter(i=>i.id!==x.id)});
      const nref=S.db.doc('news/'+newKey);const ncur=await nref.get();
      const list=(ncur.exists?ncur.data().issues||[]:[]).concat([x]).sort((a,b)=>(b.addedAt||'').localeCompare(a.addedAt||'')).slice(0,40);
      await nref.set({cat:E.cat,updatedAt:x.editedAt,issues:list});
    }
    if(oldPhoto&&S.assets){try{await S.assets.delete(oldPhoto)}catch(e){}}
    S.edit=null;S.aview='list';toast('고친 내용을 저장했어');
  }catch(e){E.busy=false;toast('저장하지 못했어. 다시 눌러줘')}
  render();
}

/* ============ 포인트와 배지 ============ */
const BADGE_POSE={opposite:'oho_hmm',compare:'both_search',wide:'oho_reading',words:'aha_love',streak:'both_hug',notes:'aha_thumbs',essay:'oho_star'};
const BADGES=[
 {k:'opposite',n:'반대편 탐험가',d:'오호와 대화하며 다른 관점을 떠올렸어',who:'oho',test:a=>a.notes.some(n=>(n.oho||[]).length>=2)},
 {k:'compare',n:'비교 달인',d:'언론사 2곳 이상을 비교한 기사 5개 읽기',who:'aha',test:a=>a.reads.filter(r=>r.issue&&(r.issue.outlets||[]).length>=2).length>=5},
 {k:'wide',n:'넓은 시야',d:'최근 7일 동안 5개 분야 읽기',who:'oho',test:a=>{const t=Date.now()-7*864e5;return new Set(a.reads.filter(r=>Date.parse(r.readAt||0)>=t).map(r=>r.cat)).size>=5}},
 {k:'words',n:'단어 수집가',d:'단어장에 단어 20개 담기',who:'aha',test:a=>a.words.length>=20},
 {k:'streak',n:'7일 탐험',d:'7일 연속 탐험할 때마다 하나씩',who:'both',test:a=>(a.p.weeks||0)>=1||(a.p.maxStreak||0)>=7},
 {k:'notes',n:'생각 기록가',d:'생각 정리 노트 10개',who:'aha',test:a=>a.notes.length>=10},
 {k:'essay',n:'에세이 작가',d:'에세이 1편 완성',who:'oho',test:a=>a.essays.length>=1}];
/* 같은 기사를 다른 날 다시 생각하면 +5 (하루 한 번) */
function redoRounds(){
  const out=[];
  Object.values(S.notes).forEach(n=>{const rs=Array.isArray(n.rounds)?n.rounds:[];const seen=new Set();rs.forEach((r,i)=>{const d=String(r.createdAt||'').slice(0,10);if(i===0){seen.add(d);return}if(!seen.has(d)){seen.add(d);out.push({at:r.createdAt,title:n.title,k:i+1})}})});
  return out;
}
function weeksN(){const p=S.profile||{};return Math.max(p.weeks||0,(p.maxStreak||0)>=7?1:0)}
function activity(){return {p:S.profile||{},notes:Object.values(S.notes),reads:Object.values(S.reads),words:Object.values(S.words),essays:Object.values(S.essays),lines:Object.values(S.notes).filter(n=>n.line)}}
function earned(){const a=activity();return BADGES.filter(b=>{try{return b.test(a)}catch(e){return false}}).map(b=>b.k)}
function points(){
  const a=activity(),e=earned();
  return a.reads.length*5+a.notes.length*10+a.lines.length*5+a.words.length*2+a.essays.length*20+e.length*20+Math.max(0,weeksN()-1)*20+redoRounds().length*5;
}
let badgeTimer=null;
function checkBadges(){
  if(!S.profile||!S.dbOK||S.loading)return;
  clearTimeout(badgeTimer);
  badgeTimer=setTimeout(async()=>{
    const have=Array.isArray(S.profile.badges)?S.profile.badges:null;
    const now=earned();
    if(have===null){S.profile=Object.assign({},S.profile,{badges:now,weeksSeen:weeksN()});try{await pdoc().update({badges:now,weeksSeen:weeksN()})}catch(e){}return}
    const fresh=now.filter(k=>!have.includes(k));
    const w=weeksN(),seen=S.profile.weeksSeen||0;
    if(w>seen){
      const wa=(Array.isArray(S.profile.weeksAt)?S.profile.weeksAt:[]).slice();while(wa.length<w)wa.push(new Date().toISOString());
      S.profile=Object.assign({},S.profile,{weeksSeen:w,weeksAt:wa});try{await pdoc().update({weeksSeen:w,weeksAt:wa})}catch(e){}
      if(w>1&&!fresh.length)return badgeSheet(Object.assign({},BADGES.find(x=>x.k==='streak'),{n:`7일 탐험 ×${w}`,d:`7일 연속 탐험을 ${w}번 해냈어!`,repeat:true}));
    }
    if(!fresh.length)return;
    const ba=Object.assign({},S.profile.badgeAt||{});fresh.forEach(k=>{if(!ba[k])ba[k]=new Date().toISOString()});
    S.profile=Object.assign({},S.profile,{badges:Array.from(new Set(have.concat(fresh))),badgeAt:ba});
    try{await pdoc().update({badges:S.profile.badges,badgeAt:ba})}catch(e){}
    const b=BADGES.find(x=>x.k===fresh[0]);
    if(b)badgeSheet(b);
  },1200);
}
function pointPop(p,label){

function badgeSheet(b){
  const after=points(),before=Math.max(0,after-20);

    <p class="cel-plus">+20P</p>

    <button type="button" class="btn ghost small" id="slog" style="width:100%">포인트 기록 보기</button>
   </div></div>`;
  const close=()=>$('layer').innerHTML='';
  $('sclose').onclick=close;$('slog').onclick=()=>{close();go('points')};
  const el=$('celnum'),t0=performance.now(),dur=1100;
  const tick=t=>{if(!document.body.contains(el))return;const k=Math.min(1,(t-t0-500)/dur);if(k>0)el.textContent=Math.round(before+(after-before)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
}
/* 포인트 기록: 저장된 활동에서 날짜와 함께 다시 계산 (합계 = points()) */
function pointLog(){
  const a=activity(),p=a.p,out=[];
  a.reads.forEach(r=>out.push({at:r.readAt,what:'기사 읽기',title:r.title||(r.issue&&r.issue.title)||'',p:5,who:'oho'}));
  a.notes.forEach(n=>{out.push({at:n.firstAt||n.createdAt,what:'생각 정리 노트',title:n.title,p:10,who:'aha'});if(n.line)out.push({at:n.createdAt,what:'한 줄 평',title:n.line,p:5,who:'aha'})});
  a.words.forEach(w=>out.push({at:w.addedAt,what:'단어 담기',title:w.term,p:2,who:'aha'}));
  a.essays.forEach(e=>out.push({at:e.createdAt,what:'에세이 완성',title:e.title,p:20,who:'oho'}));
  earned().forEach(k=>{const b=BADGES.find(x=>x.k===k);out.push({at:(p.badgeAt||{})[k]||null,what:'배지 획득',title:b?b.n:k,p:20,who:'both',badge:true})});
  redoRounds().forEach(r=>out.push({at:r.at,what:'다시 생각하기',title:`${r.title} (${r.k}번째)`,p:5,who:'oho'}));
  const w=weeksN(),wa=Array.isArray(p.weeksAt)?p.weeksAt:[];
  for(let i=2;i<=w;i++)out.push({at:wa[i-1]||null,what:'배지 획득',title:`7일 탐험 ×${i}`,p:20,who:'both',badge:true});
  return out.sort((x,y)=>(y.at||'').localeCompare(x.at||''));
}
function vPoints(){
  const log=pointLog(),total=points();
  const fmt=d=>{if(!d)return '날짜 기록 전';const t=new Date(d);return `${t.getMonth()+1}월 ${t.getDate()}일`};
  const groups=[];log.forEach(it=>{const k=fmt(it.at);const g=groups[groups.length-1];if(g&&g.k===k)g.items.push(it);else groups.push({k,items:[it]})});
  const by=w=>log.filter(i=>i.what===w).reduce((s,i)=>s+i.p,0);
  return `${topBar('포인트 기록','my')}
  <div class="card" style="flex-direction:row;align-items:center;gap:12px;background:var(--oho-tint);border:0">${rabbit('oho',80,'mix_star')}<div style="display:flex;flex-direction:column;gap:2px"><span class="muted" style="color:var(--oho-ink)">지금까지 모은 포인트</span><b style="font-family:var(--display);font-weight:400;font-size:34px;color:var(--oho-ink)">${total}P</b></div></div>
  <div class="tags">${[['기사 읽기','읽기'],['생각 정리 노트','생각 기록'],['다시 생각하기','다시 생각'],['한 줄 평','한 줄 평'],['단어 담기','단어'],['에세이 완성','에세이'],['배지 획득','배지']].map(([w,n])=>`<span class="chip l" style="height:30px">${n} ${by(w)}P</span>`).join('')}</div>
  ${log.length?groups.map(g=>`<div class="card" style="gap:0;padding:6px 16px"><p class="muted" style="padding:8px 0 4px">${esc(g.k)}</p>${g.items.map(it=>`<div class="row between" style="gap:10px;padding:10px 0;border-top:1px solid var(--line)"><span class="row" style="gap:10px;min-width:0">${rabbit(it.who,30)}<span style="display:flex;flex-direction:column;min-width:0"><b style="font-size:14px">${esc(it.what)}${it.badge?' 🏅':''}</b><span class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.title||'')}</span></span></span><b style="font-family:var(--display);font-weight:400;font-size:18px;color:${it.badge?'var(--heart)':'var(--oho-ink)'};flex-shrink:0">+${it.p}</b></div>`).join('')}</div>`).join(''):
  `<div class="card empty">${rabbit('aha',80,'aha_coffee')}<p class="muted">기사를 읽으면 포인트가 쌓이기 시작해.</p><button type="button" class="btn small" data-go="home">오늘의 뉴스 보러 가기</button></div>`}
  <p class="muted" style="text-align:center">기록을 지우면 그만큼 포인트도 빠져.</p>`;
}

/* ============ 같은 연령대 친구들 ============ */
const STAT_MIN=30;
function ageKey(a){return {'초등 고학년':'elem','중학생':'middle','고등학생':'high'}[a]||''}
async function recordStat(x,before,after){
  const ak=ageKey(S.profile&&S.profile.age);if(!ak||!x||x.mine)return;
  try{
    const ref=S.db.doc('stats/'+x.id);const cur=await ref.get();
    const d=cur.exists?cur.data():{};const g=Object.assign({n:0,b:0,a:0,moved:0},d[ak]||{});
    g.n+=1;g.b+=before[0]||0;g.a+=after[0]||0;if(Math.abs((after[0]||0)-(before[0]||0))>=10)g.moved+=1;
    d[ak]=g;d.updatedAt=new Date().toISOString();
    await ref.set(d);
  }catch(e){}
}
async function loadStat(n){
  const ak=ageKey(S.profile&&S.profile.age);if(!ak)return;
  try{const s=await S.db.doc('stats/'+n.issueId).get();const g=s.exists&&s.data()[ak]||{n:0};S.stat=Object.assign({for:n.issueId,age:S.profile.age},g);if(S.route==='note')render()}catch(e){}
}
function statCard(n){
  const s=S.stat;if(!s||s.loading||s.for!==n.issueId||!(n.stance&&n.stance[0]))return '';
  if((s.n||0)<STAT_MIN)return `<div class="card" style="background:var(--bg)"><h3>같은 ${esc(s.age)} 친구들은?</h3><p class="muted">지금까지 ${s.n||0}명이 이 기사로 생각을 기록했어. ${STAT_MIN}명이 모이면 평균을 보여줄게.</p></div>`;
  const b=Math.round(s.b/s.n),a=Math.round(s.a/s.n),q=n.stance[0];
  return `<div class="card"><h3>같은 ${esc(s.age)} 친구들 ${s.n}명은?</h3><p style="font-size:14px">${esc(q.q)}</p>${miniTrack(b,a)}<div class="labels"><span>${esc(q.left)}</span><span>${esc(q.right)}</span></div>
   <p class="muted">${Math.round(s.moved/s.n*100)}%가 대화 뒤에 생각의 위치를 옮겼어. 많은 쪽이 정답이라는 뜻은 아니야.</p></div>`;
}

/* ============ 같은 사건, 다른 언론사 기사 묶기 ============ */
const MAX_OUTLETS=3;
function sameCandidates(cat){return (S.news[cat]||[]).filter(x=>(x.outlets||[]).length<MAX_OUTLETS).slice(0,15)}
function candidateText(list){return list.map(x=>`- id: ${x.id} | 제목: ${x.title} | 요약: ${String(x.summary1||'').slice(0,90)} | 언론사: ${(x.outlets||[]).map(o=>o.name).join(', ')}`).join('\n')}
/* AI가 고른 id가 진짜 후보인지, 언론사가 겹치지 않는지 확인 */
function sameHint(r,cat,names){
  const c=r&&r.same_event;const id=c&&String(c.id||'').trim();if(!id)return null;
  const base=sameCandidates(cat).find(x=>x.id===id);if(!base)return null;
  const have=(base.outlets||[]).map(o=>o.name);
  if(names.some(n=>have.includes(n)))return null;
  if(have.length+names.length>MAX_OUTLETS)return null;
  return {id,why:String(c.why||'').trim().slice(0,90),title:base.title,done:false};
}
function sameCard(F){
  const h=F.same;if(!h||h.done)return '';
  return `<div class="card" style="background:var(--oho-tint);border:2px solid var(--oho-ink);gap:10px"><div class="row" style="align-items:flex-start;gap:10px">${rabbit('both',64,'both_search')}<div style="display:flex;flex-direction:column;gap:4px"><span class="who o" style="font-size:16px">같은 사건 같아!</span><p style="font-size:14px">이미 올린 <b>'${esc(h.title)}'</b>와 같은 소식으로 보여.${h.why?' '+esc(h.why):''} 하나로 묶으면 언론사 비교가 생겨.</p></div></div>
   <div class="row"><button type="button" class="btn ghost" id="sameno" style="flex:1">따로 올릴래</button><button type="button" class="btn" id="sameyes" style="flex:1">묶을래</button></div></div>`;
}
function startMerge(cat,id,opts){
  const base=(S.news[cat]||[]).find(x=>x.id===id);if(!base)return toast('기사를 찾지 못했어');
  S.merge=Object.assign({cat,id,base:JSON.parse(JSON.stringify(base)),src:[blankArticle()],busy:false,result:null,notSame:null,blocked:null,from:'manual'},opts||{});
  S.aview='merge';render();window.scrollTo(0,0);
  if(S.merge.auto)runMerge();
}
const MERGE_RULES=`너는 청소년 뉴스 앱 '원더래빗'의 편집 AI야. [이미 올린 뉴스]에 같은 사건을 다룬 [새 언론사 기사]를 더해서 언론사 비교를 만들려고 해.
1. 먼저 [새 언론사 기사]가 원더래빗 뉴스 원칙(언론사 취재 기사, 혐오 표현·갈등 조장·선정성·일반인 신상 중심이 아님)에 맞는지 screen에 적어.
2. 같은 사건(같은 일·발표·사고·결정)을 다뤘는지 same_event에 적어. 주제만 비슷하고 다른 사건이면 false, why에 쉬운 이유 한 문장.
3. 둘 다 통과하면 아래를 만들어.
- summary1, summary2: 기존 요약을 최대한 그대로 두고, 새 기사에서 꼭 필요한 사실만 더해. 합쳐서 200자 이내, 해요체. [꼭 남길 낱말]은 요약 속에 글자 그대로 남겨. [퀴즈]의 정답 근거는 summary1에 남겨.
- common: 모든 언론사가 공통으로 짚은 사실 한 문장.
- points: [언론사 순서] 그대로, 각 언론사가 "무엇을 먼저 다뤘는지" 한 문장(40자 이내, "○○을 먼저 다뤘어요." 형식). 기존 언론사 문장은 바꿀 필요가 없으면 그대로. 평가하지 마.
- facts: 확인 가능한 사실 1~3개. 기사끼리 숫자가 다르면 둘 다 쓰고 "기사마다 숫자가 달라요"라고 밝혀.
- opinions: 기사 속 의견·전망·걱정 0~3개, holder에 누구의 의견인지.
어떤 입장이 옳다고 하지 말고, 자극적 표현과 기사에 없는 내용을 쓰지 마.
오직 이 JSON으로만 답해:
{"screen":{"ok":true,"reasons":[]},"same_event":{"ok":true,"why":""},"summary1":"","summary2":"","common":"","points":[""],"facts":[""],"opinions":[{"text":"","holder":""}]}`;
function mergeSources(M){return M.src.map(a=>({outlet:String(a.outlet||'').trim(),url:String(a.url||'').trim(),title:String(a.title||'').trim(),text:String(a.text||'').trim()})).filter(a=>a.outlet||a.text||a.url)}
async function runMerge(){
  const M=S.merge;if(!M||M.busy)return;
  if(!S.sample)return toast('AI를 쓸 수 없는 상태야');
  const arts=mergeSources(M);
  if(!arts.length)return toast('더할 기사를 넣어줘');
  const have=(M.base.outlets||[]).map(o=>o.name);
  for(const a of arts){
    if(!a.outlet)return toast('언론사 이름을 적어줘');
    if(have.includes(a.outlet))return toast(`${a.outlet} 기사는 이미 들어 있어`);
    if(!okUrl(a.url))return toast(`${a.outlet} 기사 링크를 https://로 시작하게 넣어줘`);
    if(!M.fromSummary&&a.text.length<80)return toast(`${a.outlet} 기사 본문을 조금 더 붙여넣어줘`);
  }
  if(new Set(arts.map(a=>a.outlet)).size!==arts.length)return toast('서로 다른 언론사 기사를 넣어줘');
  if(have.length+arts.length>MAX_OUTLETS)return toast(`언론사는 ${MAX_OUTLETS}곳까지 묶을 수 있어`);
  const b=M.base,order=have.concat(arts.map(a=>a.outlet));
  const per=Math.floor(15000/arts.length);
  const prompt=MERGE_RULES+`\n\n[이미 올린 뉴스]\n제목: ${b.title}\n요약1: ${b.summary1}\n요약2: ${b.summary2||''}\n공통점: ${b.common||''}\n언론사별: ${(b.outlets||[]).map(o=>`${o.name} - ${o.point||''}`).join(' / ')}\n사실: ${(b.facts||[]).join(' / ')}\n의견: ${(b.opinions||[]).map(o=>`${o.text}(${o.holder})`).join(' / ')}
[꼭 남길 낱말] ${(b.glossary||[]).map(g=>g.term).join(', ')||'없음'}
[퀴즈] ${b.quiz?`${b.quiz.q} 정답: ${b.quiz.options[b.quiz.answer]}`:'없음'}
[언론사 순서] ${order.join(', ')}\n\n[새 언론사 기사]\n`+arts.map((a,i)=>`--- 새 기사 ${i+1} ---\n언론사: ${a.outlet}\n제목: ${a.title}\n${M.fromSummary?'내용(요약본)':'본문'}:\n${a.text.slice(0,per)}`).join('\n\n');
  M.busy=true;M.result=null;M.notSame=null;M.blocked=null;render();
  try{
    const r=await S.sample.json(prompt,{modelTier:'default',cache:false});
    if(r&&r.screen&&r.screen.ok===false)M.blocked={reasons:Array.isArray(r.screen.reasons)?r.screen.reasons.map(String).slice(0,3):[]};
    else if(r&&r.same_event&&r.same_event.ok===false)M.notSame=String(r.same_event.why||'같은 사건이 아닌 것 같아.');
    else M.result=normalizeMerge(r,b,arts);
  }catch(e){toast(e.code==='rate_limited'?'잠깐 쉬었다가 다시 해줘':e.code==='prompt_too_large'?'본문이 너무 길어. 핵심 문단만 넣어줘':'묶지 못했어. 다시 눌러줘')}
  M.busy=false;render();
}
function normalizeMerge(r,b,arts){
  const str=v=>typeof v==='string'?v.trim():'';const arr=v=>Array.isArray(v)?v:[];
  let s1=str(r.summary1)||b.summary1,s2=str(r.summary2)||b.summary2||'';
  const was=(b.summary1||'')+' '+(b.summary2||'');
  if((b.glossary||[]).some(g=>was.includes(g.term)&&!(s1+' '+s2).includes(g.term))){s1=b.summary1;s2=b.summary2||''} // 밑줄 낱말이 빠지면 원래 요약 유지
  const pts=arr(r.points).map(str);
  const old=(b.outlets||[]).map((o,i)=>Object.assign({},o,{point:pts[i]||o.point||''}));
  const neu=arts.map((a,j)=>({name:a.outlet,point:pts[old.length+j]||'',url:a.url,title:a.title}));
  const both=s1+' '+s2;
  const x=Object.assign({},b,{summary1:s1,summary2:s2,common:str(r.common)||b.common||'',outlets:old.concat(neu),
    facts:arr(r.facts).map(str).filter(Boolean).slice(0,3),
    opinions:arr(r.opinions).map(o=>({text:str(o&&o.text),holder:str(o&&o.holder)})).filter(o=>o.text).slice(0,3),
    glossary:(b.glossary||[]).filter(g=>both.includes(g.term))});
  if(!x.facts.length)x.facts=b.facts||[];
  return x;
}
async function saveMerge(){
  const M=S.merge;if(!M||!M.result||M.busy)return;
  M.busy=true;render();
  try{
    const x=Object.assign({},M.result,{editedAt:new Date().toISOString(),mergedAt:new Date().toISOString()});
    const key=M.cat==='loc'?'loc-'+(x.region||(S.profile&&S.profile.sido)||'seoul'):M.cat;
    const ref=S.db.doc('news/'+key);const cur=await ref.get();
    const list=(cur.exists?cur.data().issues||[]:[]);
    if(!list.some(i=>i.id===x.id))throw new Error('gone');
    await ref.set({cat:M.cat,updatedAt:x.editedAt,issues:list.map(i=>i.id===x.id?x:i)});
    if(M.from==='form')S.ad=null;
    if(M.from==='sugg'&&M.suggKey)await markSuggestion(M.suggKey,'approved',{mergedInto:x.id});
    S.merge=null;S.aview=M.from==='sugg'?'sugg':'list';toast(`${x.outlets.length}곳 언론사 비교로 묶었어`);
    if(M.from==='sugg')loadSuggestions();
  }catch(e){M.busy=false;toast(e&&e.message==='gone'?'원래 기사가 지워졌어':'저장하지 못했어. 다시 눌러줘')}
  render();
}

function bindMerge(){
  const M=S.merge;
  $('mback').onclick=()=>{S.merge=null;S.aview=M.from==='sugg'?'sugg':M.from==='form'?'add':'list';render()};
  M.src.forEach((a,i)=>['outlet','url','title','text'].forEach(f=>{const el=$('m'+f+i);if(el)el.oninput=e=>a[f]=e.target.value}));
  const ad=$('madd');if(ad)ad.onclick=()=>{M.src.push(blankArticle());render()};
  const go1=$('mgo');if(go1)go1.onclick=runMerge;
  const rg=$('mregen');if(rg)rg.onclick=runMerge;
  const sv=$('msave');if(sv)sv.onclick=saveMerge;
  const sp=$('msep');if(sp)sp.onclick=()=>{
    if(M.from==='form'){const F=S.ad;S.merge=null;S.aview='add';if(F&&F.same)F.same.done=true;render()}
    else{S.merge=null;S.aview='sugg';decideSuggestion(M.suggKey,true,M.cat,true)}
  };
}
/* 추천받은 뉴스: 공개 전에 같은 사건이 이미 있는지 확인 */
async function checkSuggSame(key,cat){
  const s=(S.sugg||[]).find(v=>v.key===key);if(!s)return null;
  const x=s.item.issue,list=sameCandidates(cat).filter(c=>!(c.outlets||[]).some(o=>(x.outlets||[]).some(n=>n.name===o.name)));
  if(!list.length||!S.sample)return null;
  const prompt=`아래 [새 뉴스]가 [이미 올린 뉴스] 중 하나와 같은 사건(같은 일·발표·사고·결정)을 다뤘는지 판단해. 주제만 비슷하면 같은 사건이 아니야. 확실할 때만 id를 적어.
[새 뉴스]\n제목: ${x.title}\n요약: ${x.summary1} ${x.summary2||''}\n\n[이미 올린 뉴스]\n${candidateText(list)}
오직 이 JSON으로만 답해: {"same_event":{"id":"","why":"같다고 본 이유 한 문장(해요체)"}}`;
  try{const r=await S.sample.json(prompt,{modelTier:'quick',cache:false});return sameHint(r,cat,(x.outlets||[]).map(o=>o.name))}catch(e){return null}
}
function startMergeFromSugg(key,cat){
  const s=(S.sugg||[]).find(v=>v.key===key),h=S.suggSame&&S.suggSame[key];if(!s||!h)return;
  const x=s.item.issue;
  const src=(x.outlets||[]).map(o=>({outlet:o.name,url:o.url,title:o.title||'',text:[x.summary1,x.summary2,'이 언론사가 먼저 다룬 점: '+(o.point||''),...(x.facts||[]).map(f=>'사실: '+f),...(x.opinions||[]).map(p=>`의견: ${p.text} (${p.holder})`)].filter(Boolean).join('\n')}));
  startMerge(cat,h.id,{src,from:'sugg',suggKey:key,fromSummary:true,auto:true});
}
async function markSuggestion(key,status,extra){
  const [user,id]=String(key).split('|');
  const ref=S.db.doc('suggestions/'+user);const cur=await ref.get();if(!cur.exists)return;
  const items=(cur.data().items||[]).map(it=>Object.assign({},it));
  const it=items.find(i=>i.id===id);if(!it)return;
  Object.assign(it,{status,decidedAt:new Date().toISOString()},extra||{});
  await ref.set({items,updatedAt:it.decidedAt});
}

  const t=S.tutState||(S.tutState={card:0,val:50,moved:false});
  if(i===0)return `<h2 class="tut-h">너와 함께할<br>두 친구를 소개할게</h2>
   <div class="tut-pair"><div>${ch('oho_curious',120)}<b class="who o">오호</b><span>궁금한 걸 물어봐</span></div><div>${ch('aha_smile',120)}<b class="who a">아하</b><span>네 생각을 정리해 줘</span></div></div>
   <p class="tut-p">오호는 "왜 그럴까?" 하고 질문을 던지고,<br>아하는 네가 한 말을 깔끔하게 정리해 줘.<br>둘이 뉴스 읽는 길을 같이 걸어갈 거야!</p>`;
  if(i===1)return `<h2 class="tut-h">같은 뉴스인데,<br>왜 다르게 말할까?</h2>
   <div class="tut-two"><div class="tut-mini o"><span class="chip d">${TUT_OUT[0].o}</span><b>${TUT_OUT[0].t}</b></div><div class="tut-mini a"><span class="chip d">${TUT_OUT[1].o}</span><b>${TUT_OUT[1].t}</b></div></div>
   <div class="row" style="gap:10px;align-items:flex-start">${ch('aha_gotit',72)}<p class="tut-p" style="text-align:left">같은 소식도 언론사마다 <b>먼저 보여주는 것</b>이 달라.<br>누가 틀린 게 아니라, 보는 곳이 다른 거야. 아하가 그 차이를 나란히 보여줄게.</p></div>`;
  if(i===2){const c=TUT_OUT[t.card];return `<h2 class="tut-h">화살표를 눌러서<br>다른 관점도 봐 봐</h2>
   <div class="tut-card"><div class="tut-pic" style="background:${art('edu',72).bg}">${art('edu',64).svg}<button type="button" class="tut-arr l" id="tprev" aria-label="이전 언론사">‹</button><button type="button" class="tut-arr r" id="tnext" aria-label="다음 언론사">›</button></div>
    <div class="tut-cbody"><span class="chip o">${c.o}</span><b style="font-size:17px">${c.t}</b><span class="muted">${c.p}</span><span class="tut-dots small">${TUT_OUT.map((_,k)=>`<i class="${k===t.card?'on':''}"></i>`).join('')}</span></div></div>
   <p class="tut-p">한번 눌러 봐! 같은 급식 소식도<br>언론사에 따라 이렇게 다르게 보여.</p>`}
  if(i===3){const v=t.val;const where=v<40?'반대 쪽':v>60?'찬성 쪽':'가운데';return `<h2 class="tut-h">네 생각은 어디쯤?<br>움직여서 답해 봐</h2>
   <div class="card slider" style="text-align:left"><label for="tutsl" style="font-weight:700">채식 급식, 어떻게 생각해?</label><div class="track"><input id="tutsl" type="range" min="0" max="100" value="${v}"></div><div class="labels"><span>반대해</span><span>잘 모르겠어</span><span>찬성해</span></div></div>
   <div class="row" style="gap:10px;align-items:flex-end">${ch('oho_curious',64)}<div class="bubble o" id="tutsay" style="text-align:left">${t.moved?`오호! <b>${where}</b>이구나. 왜 그렇게 생각했는지 나중에 물어볼게!`:'막대를 움직여서 네 생각과 가까운 곳을 짚어 봐. 정답은 없어!'}</div></div>
   <p class="tut-p">기사를 읽은 직후에 한 번,<br>오호랑 이야기한 뒤에 또 한 번 짚어. 생각이 움직였는지 보려고!</p>`}
  if(i===4)return `<h2 class="tut-h">네 생각은<br>차곡차곡 쌓여</h2>
   <div class="card" style="gap:10px;text-align:left"><span class="muted">이렇게 진행돼</span>${stepper(4)}</div>
   <div class="card" style="gap:8px;text-align:left"><span class="muted"><span style="color:var(--oho)">●</span> 오늘 · 채식 급식</span><b style="font-size:15px">읽은 직후 "반대" → 대화한 뒤 "가운데"</b>${miniTrack(25,50)}
    <div class="tags"><span class="chip o">+15 포인트</span><span class="chip a">포트폴리오 기록</span><span class="chip l">단어장</span><span class="chip l">🏅 배지</span></div></div>
   <p class="tut-p">생각을 남길수록 포인트가 쌓이고, 네 생각이 어떻게 변했는지 기록으로 남아. 모은 한 줄 평으로 에세이도 쓸 수 있어!</p>`;
  return `<div class="tut-final">${ch('both_heart',120)}</div><h2 class="tut-h">준비됐어?<br>오늘의 뉴스 보러 가자</h2><p class="tut-p" style="margin-top:-6px">오호랑 아하가 기다리고 있어!</p>
   <div class="card tut-rules"><b>시작하기 전에, 약속 세 가지</b>
    <p>🔒 <span><b>내 이름·학교·전화번호는 쓰지 않기.</b> 혹시 써도 자동으로 가려져.</span></p>
    <p>🤔 <span><b>정답은 없어.</b> 생각이 바뀌어도, 그대로여도 다 괜찮아.</span></p>
    <p>🤖 <span><b>AI도 틀릴 수 있어.</b> 이상하면 원문 기사를 꼭 확인해 봐.</span></p></div>`;
}
function vTut(){
  const i=Math.max(0,Math.min(TUT_N-1,S.tut||0)),last=i===TUT_N-1;
  const finish=()=>{markTutSeen();S.tutState=null;const back=S.tutFrom;S.tutFrom=null;go(back||(S.profile?'home':'onboard'))};
  after=()=>{
    const sk=$('tskip');if(sk)sk.onclick=finish;
    const bk=$('tback');if(bk)bk.onclick=()=>{S.tut=i-1;render()};
    $('tgo').onclick=()=>{if(last)return finish();S.tut=i+1;render();window.scrollTo(0,0)};
    const t=S.tutState;
    const pv=$('tprev'),nx=$('tnext');
    if(pv)pv.onclick=()=>{t.card=(t.card+TUT_OUT.length-1)%TUT_OUT.length;render()};
    if(nx)nx.onclick=()=>{t.card=(t.card+1)%TUT_OUT.length;render()};
    const sl=$('tutsl');if(sl)sl.oninput=e=>{t.val=+e.target.value;t.moved=true;const v=t.val,w=v<40?'반대 쪽':v>60?'찬성 쪽':'가운데';$('tutsay').innerHTML=`오호! <b>${w}</b>이구나. 왜 그렇게 생각했는지 나중에 물어볼게!`};
    const box=$('tutbox');let x0=null;
    if(box){box.ontouchstart=e=>{if(e.target.closest('input'))return;x0=e.touches[0].clientX};box.ontouchend=e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)<60)return;if(dx<0&&!last){S.tut=i+1;render()}else if(dx>0&&i>0){S.tut=i-1;render()}}}
  };
  return `<div class="tut" id="tutbox">
   <div class="tut-top">${i>0?`<button type="button" class="tut-link" id="tback">‹ 이전</button>`:'<span></span>'}${last?'<span></span>':`<button type="button" class="tut-link" id="tskip">건너뛰기</button>`}</div>
   <div class="tut-body" aria-live="polite">${tutSlide(i)}</div>
   <div class="tut-dots" aria-label="${i+1} / ${TUT_N}">${Array.from({length:TUT_N},(_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
   <button type="button" class="btn dark tut-go" id="tgo">${last?'시작하기':'다음'}</button></div>`;
}

/* ============ 이벤트 연결 ============ */
document.addEventListener('click',e=>{
  const g=e.target.closest('#goread');if(g){markRead(S.issue);S.flow={quiz:null,line:''};go('read')}
});
boot();
</script>
